name: Data archive

# The data folder (Brett, 2026-10-23): data_archive.py pulls PokeViews' market feeds, exports the collector's
# PriceCharting history and the eBay Catalog's figures, and commits them to data/ on main, so an analysis can start
# from the repository instead of collecting again. Daily after the site build; the 2nd of each month (and a manual run
# with full = true) also rewrites the big PriceCharting panel and the eBay daily rollup. data/README.md is the dictionary.

on:
  schedule:
    - cron: "41 10 * * *"      # daily, 10:41 UTC (the site build runs at 10:00)
  workflow_dispatch:
    inputs:
      full:
        description: "Also export the PriceCharting panel (2.3M card-months) and the eBay daily rollup"
        type: boolean
        default: false

permissions:
  contents: write             # the results are committed to main

concurrency:
  group: data-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch the newest PriceCharting snapshot (card names for the exports)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snapshots
          newest=$(gh release view snapshots --json assets -q '[.assets[].name | select(startswith("pc_catalog_"))] | sort | last')
          echo "newest snapshot: $newest"
          gh release download snapshots --dir snapshots --pattern "$newest" --clobber

      - name: "Fetch the collector's files (the live branch: pc/ shards and the live file)"
        run: |
          git fetch --depth 1 origin live
          rm -rf live_pc && mkdir -p live_pc && git archive FETCH_HEAD pc ebay_live.bin | tar -x -C live_pc
          echo "$(ls live_pc/pc | wc -l) shard(s), live file $(stat -c %s live_pc/ebay_live.bin) bytes"

      - name: Export
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          FULL: ${{ github.event.inputs.full }}
        run: |
          full=""
          if [ "$FULL" = "true" ] || [ "$(date -u +%d)" = "02" ]; then full="--full"; fi
          echo "mode: ${full:-daily}"
          python data_archive.py --live-dir live_pc --snapshots snapshots --out data $full
          du -sh data data/* | sort -k2

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Data archive $(date -u +%F)" -m "data_archive.py (the Data archive workflow) refreshed: $(git diff --cached --name-only | sed 's#/[^/]*$##' | sort -u | tr '\n' ' ')"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (main moved) - rebasing and trying again"
            git pull --rebase origin main
          done
          exit 1
