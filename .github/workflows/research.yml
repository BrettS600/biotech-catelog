name: Research results

# Regenerates data/research/results/ from the committed data/ folder by running every research script
# (data/research/scripts/e*.py). Dispatch it by hand after changing a script or when a fresh month of data
# is in; it commits the results to main. The notes in data/research/notes quote the 2026-10-24 run (round 1,
# E01-E25) and the 2026-10-26 run (round 2, E26-E42) - results regenerated later differ slightly because data/
# is refreshed daily (the current month is partial and the eBay snapshot, rollup and daily download are newer).
# 2026-10-27: the scripts, notes, results and the data they read live in the PRIVATE repo BrettS600/card-data
# (data/research/...): this repo is public and the data is not for redistribution. The job checks card-data out with the
# DATA_REPO_TOKEN secret, runs there and pushes the results there.

on:
  workflow_dispatch:

permissions:
  contents: read              # the results go to card-data (DATA_REPO_TOKEN), not this repo

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the private data repo (BrettS600/card-data)
        uses: actions/checkout@v4
        with:
          repository: BrettS600/card-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: card-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas scipy scikit-learn statsmodels
      - name: Run the experiments
        working-directory: card-data/data/research/scripts
        run: |
          mkdir -p ../results
          for s in e01_fee_wall e02_signals e03_reversal e04_market_timing e04b_incremental e05_calendar_age e06_ml e06b_ml_variants e07_ebay_micro e08_fee_lever e09_dip_print e10_portfolio_sim e11_pv_set_index e12_risk_hold e13_ebay_daily e15_gate_variants e16_pick_composition e17_horizon_gate_sizing e18_signal_robustness e19_cap_band_grid e20_chance_table e21_fama_macbeth e22_asset_leadlag e23_exit_rules e24_exit_rule_portfolio e25_exit_rule_stress e26_graded_vs_raw e26b_graded_leads_raw e27_daily_graded_raw e27b_ratio_vs_dev12 e27c_ratio_windows e27d_ratio_on_ebay e27e_ratio_x_dev12 e28_gate_with_graded e29_grading_ev e30_buy_channels e31_era_rotation_vol e32_daily_weekly_signals e33_new_reversal_variants e33b_relative_reversal e33c_setdev_october e33d_liquid_cards e34_sim_relative_reversal e35_pc_lag_vs_tcgplayer e36_sim_gates_graded e37_paired_sim e38_dev12_decomposition e39_lookback_variants e40_chance_table_rel e41_reprint_event e42_graded_hot_months; do
            echo "== $s"
            python3 $s.py > ../results/$s.log 2>&1 || echo "FAILED $s (see results/$s.log)"
          done
          rm -f ../results/E10_sim_cycles.csv
          date -u +%FT%TZ > ../results/generated_at.txt
      - name: Commit to card-data
        working-directory: card-data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/research/results
          git commit -m "Research results $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break || sleep 15; done
