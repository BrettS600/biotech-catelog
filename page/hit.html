<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hit check</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 560px; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); background: #0d1117; color: #e6edf3; font: 16px/1.35 -apple-system, system-ui, sans-serif; }
h1 { font-size: 17px; margin: 0 0 4px; }
.dim { color: #8b949e; font-size: 13px; }
.price { font-size: 15px; margin: 2px 0 10px; }
.pair { display: flex; gap: 8px; align-items: stretch; }
.side { flex: 1 1 0; min-width: 0; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 8px; }
.side h2 { font-size: 12px; margin: 0 0 6px; color: #8b949e; text-transform: uppercase; letter-spacing: .04em; }
.pic { width: 100%; aspect-ratio: 5 / 7; object-fit: contain; background: #010409; border-radius: 6px; display: block; }
.pcbox { width: 100%; aspect-ratio: 5 / 7; background: #010409; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; }
.pcbox a { color: #fff; background: #1f6feb; padding: 12px 10px; border-radius: 8px; text-decoration: none; font-weight: 600; }
.thumbs { display: flex; gap: 4px; margin-top: 4px; }
.thumbs img { width: 25%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; border: 2px solid transparent; }
.thumbs img.on { border-color: #1f6feb; }
.side h2 a { color: #58a6ff; text-decoration: none; }
.rows { margin-top: 10px; border-top: 1px solid #30363d; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 9px 9px; border-bottom: 1px solid #30363d; }
.row > div { min-width: 0; }
.row .lab { display: block; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 1px; }
.row b { font-size: 18px; }
.row small { display: block; font-size: 12px; color: #8b949e; margin-top: 1px; }
.row b.amber { color: #e3b341; }
.row b.fit { display: block; white-space: nowrap; overflow: hidden; font-size: 16px; }   /* set name, rarity, finish: one line each, shrunk to fit */
.row b.bad { color: #f85149; }
.row b.mute { color: #8b949e; font-weight: 400; }
.rp { margin-top: 10px; background: #2d1f00; border: 1px solid #9e6a03; border-radius: 10px; padding: 9px 10px; font-size: 14px; overflow: hidden; }
.rp img { float: right; width: 74px; border-radius: 5px; margin: 0 0 4px 10px; }
.rp a { color: #58a6ff; }
a.next { display: block; text-align: center; margin-top: 14px; padding: 8px; color: #58a6ff; text-decoration: none; font-size: 16px; }
.tag { display: inline-block; background: #30363d; border-radius: 5px; padding: 1px 6px; margin: 2px 3px 0 0; font-size: 12px; }
.tag.warn { background: #9e6a03; } .tag.bad { background: #da3633; } .tag.ok { background: #238636; }
.scam { margin-top: 10px; background: #2d1f00; border: 1px solid #9e6a03; border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.scam ul { margin: 4px 0 0; padding-left: 18px; }
.scam.sus { background: #3d0f0f; border-color: #da3633; }
.scam .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
button.wbtn { flex: none; padding: 6px 10px; font: 600 13px/1.2 inherit; border-radius: 8px; background: #9e6a03; color: #fff; white-space: nowrap; }
.scam.sus button.wbtn { background: #da3633; }
.wt { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
.wt th, .wt td { text-align: left; padding: 5px 5px; border-bottom: 1px solid #30363d; vertical-align: top; }
.wt th { color: #8b949e; font-weight: 600; } .wt .num { text-align: right; white-space: nowrap; } .wt .code { color: #8b949e; }
.wt tr.tot td { font-weight: 600; border-bottom: 0; }
.wfoot { margin-top: 6px; font-size: 12px; color: #8b949e; }
.btns { display: flex; gap: 10px; margin-top: 14px; }
button { flex: 1; border: 0; border-radius: 12px; padding: 16px 8px; font: 600 18px/1.25 inherit; color: #fff; }
.yes { background: #238636; } .no { background: #da3633; } .lp { background: #9e6a03; }
button:disabled { background: #30363d; color: #8b949e; }
button small { display: block; font-weight: 400; font-size: 14px; margin-top: 4px; }
.two button { padding: 18px 6px; }
.two button small { font-size: 15px; margin-top: 10px; }
.hide { display: none; }
/* the condition row (Brett, 2026-10-25: "lets have it so question 1 ask for the condition"): five small buttons, on both screens */
.cond { margin-top: 12px; }
.cond .lab { display: block; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.cbtns { display: flex; gap: 5px; }
button.cb { flex: 1; padding: 9px 2px; font: 600 15px/1.15 inherit; border-radius: 9px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
button.cb small { font-size: 10px; margin-top: 2px; font-weight: 400; color: #8b949e; }
button.cb.on { background: #1f6feb; border-color: #1f6feb; } button.cb.on small { color: #e6edf3; }
button.cb.on.bad { background: #da3633; border-color: #da3633; }
/* the No's reason panel */
.nopanel { margin-top: 12px; background: #3d0f0f; border: 1px solid #da3633; border-radius: 10px; padding: 10px; }
.nopanel .lab { display: block; font-size: 11px; color: #ffa198; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.rbtns { display: flex; flex-wrap: wrap; gap: 6px; }
button.rb { flex: 1 1 30%; padding: 10px 6px; font: 600 14px/1.2 inherit; border-radius: 9px; background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
button.rb.on { background: #da3633; border-color: #da3633; }
.nopanel textarea { width: 100%; margin-top: 8px; min-height: 64px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font: 15px/1.3 inherit; padding: 8px; }
.nopanel .send { margin-top: 8px; display: flex; gap: 10px; align-items: center; }
.nopanel .send button { flex: 1; padding: 12px 8px; font-size: 16px; background: #da3633; }
.nopanel .send button:disabled { background: #30363d; }
.nopanel .send a { color: #8b949e; flex: none; }
.nopanel .rwhat { font-size: 12px; color: #ffa198; margin-top: 6px; }
/* the second question: one block for the grade chosen; red when over the max, still a link to the listing */
button.over { background: #da3633; }
.fig { margin-top: 10px; }
.nobuy { margin-top: 10px; background: #3d0f0f; border: 1px solid #da3633; border-radius: 12px; padding: 14px 12px; font-size: 16px; }
.nobuy a { color: #58a6ff; display: block; margin-top: 8px; }
.how { margin-top: 14px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.how h3 { font-size: 12px; margin: 0 0 6px; color: #8b949e; text-transform: uppercase; letter-spacing: .04em; }
.how ul { margin: 0; padding-left: 16px; } .how li { margin: 2px 0; } .how b { color: #e6edf3; }
.how table { width: 100%; border-collapse: collapse; margin-top: 4px; } .how td, .how th { text-align: left; padding: 3px 4px; border-bottom: 1px solid #30363d; font-size: 13px; }
.how th { color: #8b949e; font-weight: 600; } .how td.num, .how th.num { text-align: right; } .how tr.pick td { color: #e6edf3; font-weight: 600; }
.how .ok { color: #3fb950; } .how .bad { color: #f85149; }
.kind { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #238636; margin-left: 6px; vertical-align: middle; }
.kind.fc { background: #1f6feb; } .kind.lead { background: #9e6a03; } .kind.au { background: #6e40c9; } .kind.test { background: #30363d; }
#msg { margin-top: 30px; text-align: center; font-size: 18px; }
a.back { display: inline-block; margin-top: 14px; color: #58a6ff; }
</style></head><body>
<div id="s1">
  <h1 id="title"></h1>
  <div class="price" id="price"></div>
  <div class="pair">
    <div class="side"><h2>PriceCharting</h2>
      <div class="pcbox"><a id="pclink" target="_blank" rel="noopener">See the picture on PriceCharting</a></div></div>
    <div class="side"><h2><a id="eblink" target="_blank" rel="noopener">eBay listing &#8599;</a></h2>
      <a id="piclink" target="_blank" rel="noopener"><img class="pic" id="pic" alt="eBay photo: tap to open the listing"></a><div class="thumbs" id="thumbs"></div></div>
  </div>
  <div class="rp hide" id="rp"></div>
  <div class="rows" id="rows"></div>
  <div class="scam hide" id="scam"></div>
  <div class="cond" id="cond1"><span class="lab">Your grade from the photos</span><div class="cbtns"></div><div class="dim" id="condnote"></div></div>
  <div class="btns" id="q1btns"><button class="no" id="no">No<small>not the same card</small></button><button class="yes" id="yes">Yes<small>same card</small></button></div>
  <div class="nopanel hide" id="nopanel">
    <span class="lab">Why not? Pick the reason</span>
    <div class="rbtns" id="rbtns"></div>
    <div class="rwhat" id="rwhat"></div>
    <textarea id="rnote" placeholder="your reasoning (kept with the flag, for the analysis later)"></textarea>
    <div class="send"><button type="button" id="rsend" disabled>Send</button><a href="#" id="rcancel">Cancel</a></div>
  </div>
  <a class="next" href="#" id="next">Next question &rarr;</a>
</div>
<div id="s2" class="hide">
  <h1 id="s2h">The numbers</h1>
  <div class="dim" id="s2sub"></div>
  <div class="cond" id="cond2"><span class="lab">Your grade from the photos</span><div class="cbtns"></div></div>
  <div class="fig" id="fig"></div>
  <div class="how" id="how"></div>
  <div class="how hide" id="fcb"></div>
  <div class="dim" id="s2cond"></div>
  <a class="back" href="#" id="back">&larr; back to the pictures</a>
</div>
<div id="msg" class="hide"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const money = v => v == null || isNaN(Number(v)) ? '?' : (v < 0 ? '-' : '') + '$' + Math.abs(Number(v)).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const one = v => v == null ? '?' : String(Math.round(v * 10) / 10);
const SIG = {p50: [4, 'priced under half of what the card goes for'], p65: [2, 'priced well under what the card goes for'], p75: [1, 'priced under what the card goes for'],
  fbq: [1, 'seller rating count unknown'], fb0: [3, 'seller has fewer than 10 ratings'], fb1: [1, 'seller has fewer than 50 ratings'], pct: [2, 'seller feedback below the bar'],
  img: [1, 'only one photo'], qty: [2, '3 or more copies of a pricey card from a small seller'], dup: [3, 'same photo used by another seller'], ret: [1, 'no returns on a cheap listing'],
  slow: [1, 'delivery estimate over 10 days'], top: [-2, 'Top Rated seller'], est: [-1, 'established seller (500+ ratings, 99%+)'], burst: [0, 'new seller listing many cheap cards at once']};
let d = null;
let flag = '';
try { const h = location.hash.slice(1), i = h.indexOf('.'); flag = i < 0 ? '' : h.slice(i + 1); const b = (i < 0 ? h : h.slice(0, i)).replace(/-/g, '+').replace(/_/g, '/'); d = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))); } catch (e) {}
// the site's wording of each signal (ebay_sweep.SCAM_LABELS), for the Warnings table; SIG above is the plain-language line
const LAB = {p50: 'priced under 50% of the card\'s price', p65: 'priced 50-65% of the card\'s price', p75: 'priced 65-75% of the card\'s price', fb0: 'seller feedback under 10', fb1: 'seller feedback 10-49',
  fbq: 'seller feedback unknown', pct: 'feedback % below the bar for its count', img: 'one photo only', qty: '3+ copies available of a $75+ card', dup: 'photo also used by another seller',
  ret: 'no returns and priced under 65%', slow: 'delivery window over 10 days', top: 'Top Rated Plus', est: '500+ feedback at 99%+', burst: 'same-day burst from an unseen seller'};
const tell = a => { try { if (d && d.rq && d.tk) fetch('https://ntfy.sh/' + d.rq, {method: 'POST', keepalive: true, body: JSON.stringify({dec: Object.assign({i: d.i, tk: d.tk}, typeof a === 'object' ? a : {d: a})})}); } catch (e) {} };   // {d} or {d, st, note}
function show(id) { for (const k of ['s1', 's2', 'msg']) $(k).classList.toggle('hide', k !== id); window.scrollTo(0, 0); }
function done(text) { $('msg').innerHTML = text; show('msg'); }
if (!d) done('This link has no hit in it. Open the alert again.');
else {
  const big = u => String(u || '').replace(/s-l\d+\./, 's-l1600.');
  $('title').textContent = d.c + ' \u2014 ' + String(d.s || '').replace('Pokemon ', '');
  const au = d.au;
  $('price').classList.toggle('hide', !au);
  if (au) $('price').innerHTML = '<b>' + money(au.b) + '</b> current bid <span class="dim">\u00b7 ' + au.n + ' bid' + (au.n === 1 ? '' : 's') + '</span><br><b id="left"></b>';
  if (au) { const tick = () => { const t = Math.round((new Date(au.e) - Date.now()) / 1000); $('left').textContent = t > 0 ? 'Auction ends in ' + Math.floor(t / 60) + ' min ' + (t % 60) + ' s' : 'Auction ended'; }; tick(); setInterval(tick, 1000); }
  $('pclink').href = 'https://www.pricecharting.com/game/' + d.pid;
  if (d.pci) { const box = $('pclink').parentNode; box.className = ''; box.innerHTML = '<a href="' + $('pclink').href + '" target="_blank" rel="noopener"><img class="pic" alt="PriceCharting picture" src="' + esc(d.pci) + '"></a>'; }
  $('piclink').href = $('eblink').href = d.u || '#';       // tapping the eBay photo (or its heading) opens the listing
  const pics = (d.im || []).filter(Boolean);
  const setPic = i => { $('pic').src = big(pics[i]); [...$('thumbs').children].forEach((t, k) => t.classList.toggle('on', k === i)); };
  $('thumbs').innerHTML = pics.length > 1 ? pics.map(u => '<img src="' + esc(u) + '" alt="">').join('') : '';
  [...$('thumbs').children].forEach((t, i) => t.addEventListener('click', () => setPic(i)));
  if (pics.length) setPic(0);
  // One fact per row, a line between rows, PriceCharting on the left and eBay across from it (Brett, 2026-10-06): no
  // names, no "regular printing", no "item specifics agree". A printing or a specifics line appears only when there is
  // something to check: the matched card is a special printing, or the seller's item specifics name another card.
  const m = /(\d+)\s*\/\s*(\d+)/.exec(d.t || '');
  const fact = (lab, val, sub) => '<span class="lab">' + lab + '</span><b>' + val + '</b>' + (sub ? '<small>' + sub + '</small>' : '');
  const row = (l, r) => '<div class="row"><div>' + (l || '') + '</div><div>' + (r || '') + '</div></div>';
  // Set name, rarity and finish, PriceCharting against eBay (Brett, 2026-10-12): the card's own words from the daily build
  // on the left; what eBay's "About this product" block or the seller's item specifics say on the right - red when the
  // collector finds them naming another card, amber when one tier apart. Long names shrink to stay on one line (fitRows).
  const rf = d.rf || ['', ''], ef = d.ef;                 // ef: null = not read, [] = nothing on the listing, else eBay's record
  const pcv = v => v ? '<b class="fit">' + esc(v) + '</b>' : '<b class="fit mute">unknown</b>';
  const ebv = (i, cmp) => ef == null ? '<b class="fit mute">not read</b>' : !ef.length || !ef[i] ? '<b class="fit mute">not stated</b>'
    : '<b class="fit' + (cmp === 'far' ? ' bad' : cmp === 'near' ? ' amber' : '') + '">' + esc(ef[i]) + '</b>';
  const trio = ['Set name', 'Rarity', 'Finish'].map((lab, i) => row('<span class="lab">' + lab + '</span>' + pcv(i ? rf[i - 1] : String(d.s || '').replace(/^Pokemon /, '')),
                                                                     '<span class="lab">' + lab + '</span>' + ebv(i, ef && ef[6 + i]))).join('');
  const fitRows = () => { for (const b of document.querySelectorAll('b.fit')) {   // one line each: shrink to 9px; then drop eBay's era
    if (!b.dataset.full) b.dataset.full = b.textContent;                           // prefix ("Scarlet & Violet: 151" -> "151"); a name that
    b.textContent = b.dataset.full; b.style.whiteSpace = 'nowrap';                 // still overflows (a Topps set) wraps rather than clips
    const shrink = min => { let px = 16; b.style.fontSize = px + 'px'; while (px > min && b.scrollWidth > b.clientWidth) { px -= 0.5; b.style.fontSize = px + 'px'; } return b.scrollWidth <= b.clientWidth; };
    if (shrink(12)) continue;
    const i = b.dataset.full.indexOf(': ');
    if (i > 0 && i < 20) b.textContent = b.dataset.full.slice(i + 2);
    if (shrink(9)) continue;
    b.style.whiteSpace = 'normal'; b.style.fontSize = '11px';
  } };
  const taxAmt = d.ai != null && d.tot != null ? Math.round((d.ai - d.tot) * 100) / 100 : 0;
  // "Mismatched before": listings Brett marked as not this card - [marked, of those alerts, alerts sent]; shown only from 1 up
  const mm = d.mm && d.mm[0] > 0 ? d.mm : null;
  // A cheaper anniversary reprint carries this card's number (30th Celebration, Celebrations): only the photo tells them apart
  if (d.rp && d.rp.length) {
    const first = d.rp[0];
    $('rp').innerHTML = (first[3] ? '<a href="https://www.pricecharting.com/game/' + encodeURIComponent(first[2]) + '" target="_blank" rel="noopener"><img src="' + esc(first[3]) + '" alt="the reprint"></a>' : '') +
      '<b>Reprint check.</b> A cheaper card with this name and number exists: ' + d.rp.map(t => '<a href="https://www.pricecharting.com/game/' + encodeURIComponent(t[2]) + '" target="_blank" rel="noopener">' + esc(t[0]) + '</a>, about <b>' + money(t[1]) + '</b>').join('; ') +
      '. If the photo shows an anniversary stamp, this is that reprint and the numbers here do not apply.';
    $('rp').classList.remove('hide');
  }
  $('rows').innerHTML =
    row(fact('Set / card number', esc(d.n) + (/classic collection/i.test(rf[0] || '') ? ' <small>Classic Collection reprint: numbered as the original card was</small>' : d.st ? ' / ' + d.st : '')), fact('Set / card number', m ? m[1] + ' / ' + m[2] : 'none in the title')) +
    trio +
    (mm ? row('', '<span class="lab">Mismatched before</span><b class="amber">' + (mm[2] ? mm[1] + ' of ' + mm[2] + ' alert' + (mm[2] === 1 ? '' : 's') : mm[0] + ' listing' + (mm[0] === 1 ? '' : 's')) + '</b><small>on this card' + (mm[2] && mm[0] > mm[1] ? ' \u00b7 ' + mm[0] + ' marked in all' : '') + '</small>') : '') +
    (d.v || d.idv === 'conflict' ? row(d.v ? '<span class="tag warn">' + esc(d.v.toUpperCase()) + '</span><small>a special printing: check the photo shows it</small>' : '',
                                       d.idv === 'conflict' ? '<span class="tag bad">item specifics disagree</span><small>' + esc((d.idr || []).join('; ')) + '</small>' : '') : '') +
    row(fact('Ungraded price', money(d.pc)),
        fact(au ? 'Total at this bid' : 'Total price', money(d.ai), (au ? 'bid ' : 'card ') + money(d.it) + ' + shipping ' + money(d.sh) + (taxAmt > 0 ? ' + tax ' + money(taxAmt) + ' (' + d.tax + '%)' : ', no buy tax'))) +
    row(fact('Sales per month', d.pv == null ? '?' : one(d.pv / 12)), fact('Sold this month', d.k == null ? '?' : d.k, d.D == null ? '' : one(d.D) + ' days tracked')) +
    row('', fact('Seller', (d.fb == null ? '?' : Number(d.fb).toLocaleString('en-US')) + ' ratings', (d.pct != null ? d.pct + '% positive \u00b7 ' : '') + (d.ph == null ? '?' : d.ph) + ' photos'));
  fitRows(); window.addEventListener('resize', fitRows);
  // the condition under the trio (Brett, 2026-10-25): what the seller says (eBay's condition field, else the title), and his own
  // grade from the photos if he has given one - the next question asks for it
  const COND = {NM: 'Near Mint', LP: 'Lightly Played', MP: 'Moderately Played', HP: 'Heavily Played', DMG: 'Damaged'};
  const tc = d.tc && d.tc !== 'UNK' ? d.tc : null, bc = d.bc || null;
  $('rows').insertAdjacentHTML('beforeend', row(fact('Condition \u00b7 seller', tc ? COND[tc] || tc : '<span class="dim">not stated</span>', d.ec ? 'eBay\u2019s condition field: ' + esc(d.ec) : tc ? 'from the title' : d.ec == null ? 'none in the title; eBay\u2019s condition field not read yet' : 'none in the title, none on the listing'),
                                                 fact('Condition \u00b7 you', bc ? COND[bc] || bc : '<span class="dim">\u2014</span>', bc ? 'your grade from the photos' : 'the next question asks')));
  const condRow = $('rows').lastElementChild, trioRows = $('rows').children;   // ... placed right under Finish
  if (trioRows.length > 4) $('rows').insertBefore(condRow, trioRows[4]);
  if (d.tier === 'watch' || d.tier === 'suspect') {
    const sus = d.tier === 'suspect', k9 = d.risk && d.risk[1] ? d.risk[0] / d.risk[1] : null;
    $('scam').classList.remove('hide'); $('scam').classList.toggle('sus', sus);
    const codes = d.scr || [], sct = d.sct || [3, 5], scs = d.scs || {};
    const pts = k => (SIG[k] || [0])[0], outs = k => { const o = scs[k]; if (!o) return '<span class="code">no closed listings with this signal yet</span>';
      const n = o.reduce((a, v) => a + (v || 0), 0), pc = v => n ? ' (' + Math.round(100 * (v || 0) / n) + '%)' : '';
      return n ? n.toLocaleString('en-US') + ' closed: <b>' + (o[0] || 0).toLocaleString('en-US') + '</b> sold' + pc(o[0]) + ', ' + (o[1] || 0).toLocaleString('en-US') + ' ended, ' + (o[2] || 0).toLocaleString('en-US') + ' gone' + pc(o[2]) + ', ' + (o[3] || 0).toLocaleString('en-US') + ' outlived 2 days' : '<span class="code">no closed listings with this signal yet</span>'; };
    const totTxt = sus ? 'suspect: at or over ' + sct[1] + (codes.includes('dup') ? ', or the shared photo alone' : codes.includes('burst') ? ', or the seller burst' : '') : 'watch: ' + sct[0] + ' to ' + (sct[1] - 1);
    const table = '<table class="wt"><thead><tr><th>Signal</th><th class="num">Points</th><th>Listings with this signal</th></tr></thead><tbody>' +
      codes.map(k => '<tr><td>' + esc(LAB[k] || (SIG[k] || [0, k])[1]) + ' <span class="code">(' + esc(k) + ')</span></td><td class="num">' + (pts(k) > 0 ? '+' : '') + pts(k) + '</td><td>' + outs(k) + '</td></tr>').join('') +
      '<tr class="tot"><td>Total</td><td class="num">' + d.sc + '</td><td>' + esc(totTxt) + '</td></tr></tbody></table>' +
      '<div class="wfoot">Watch listings are shown and can alert (Notification Settings decides); suspects are hidden unless \u201cShow suspects\u201d is ticked and never alert. The seller\u2019s own bar (ratings, feedback %) is a separate check in the gate.</div>';
    $('scam').innerHTML = '<div class="head"><b>' + (sus ? 'SUSPECT: ' : 'Scam watch: ') + d.sc + ' points</b><button type="button" class="wbtn" id="wbtn">Warnings \u25be</button></div>' +
      (k9 == null ? '' : '<div>So far eBay has pulled ' + d.risk[0] + ' of ' + d.risk[1] + ' listings like this before they ended' + (k9 > 0 ? ' (about 1 in ' + Math.max(1, Math.round(1 / k9)) + ')' : '') + '.</div>') +
      '<ul id="wlist">' + codes.map(k => { const s = SIG[k] || [0, k]; return '<li>' + (s[0] > 0 ? '+' : '') + s[0] + ' \u2014 ' + esc(s[1]) + '</li>'; }).join('') + '</ul><div id="wtab" class="hide">' + table + '</div>';
    const setW = on => { $('wtab').classList.toggle('hide', !on); $('wlist').classList.toggle('hide', on); $('wbtn').textContent = on ? 'Warnings \u25b4' : 'Warnings \u25be'; };
    $('wbtn').addEventListener('click', () => setW($('wtab').classList.contains('hide')));
    if (flag.includes('w')) { setW(true); setTimeout(() => $('scam').scrollIntoView({block: 'start'}), 50); }   // opened from the notification's Warnings button
  }
  // ---- the condition row on both screens (Brett, 2026-10-25): his grade from the photos, NM / LP / MP / HP / DMG like the
  // site's Review screen; a tap records it at once (it replaces the seller's in every figure on the site) and decides
  // which figures the second question shows
  const GRADES = [['NM', 'Near Mint', 'nm'], ['LP', 'Lightly Played', 'lp'], ['MP', 'Moderately Played', 'mp'], ['HP', 'Heavily Played', 'hp'], ['DMG', 'Damaged', 'dmg']];
  let grade = bc && GRADES.some(g => g[0] === bc) ? bc : null;
  const paintGrade = () => document.querySelectorAll('button.cb').forEach(b => { b.classList.toggle('on', b.dataset.c === grade); b.classList.toggle('bad', b.dataset.c === grade && !['NM', 'LP'].includes(grade)); });
  for (const id of ['cond1', 'cond2']) {
    const box = $(id).querySelector('.cbtns');
    box.innerHTML = GRADES.map(g => '<button type="button" class="cb" data-c="' + g[0] + '">' + g[0] + '<small>' + g[1] + '</small></button>').join('');
    box.addEventListener('click', e => { const b = e.target.closest('button.cb'); if (!b) return; grade = b.dataset.c; paintGrade(); tell(GRADES.find(g => g[0] === grade)[2]); renderFig(); });
  }
  $('condnote').innerHTML = 'The seller says <b>' + (tc ? COND[tc] || tc : 'nothing') + '</b>' + (d.ec ? ' (eBay’s condition field: ' + esc(d.ec) + ')' : tc ? ' (in the title)' : '') + (bc ? ' · you graded it <b>' + (COND[bc] || bc) + '</b> before' : '') + '. Your grade replaces the seller’s in every figure on the site.';
  paintGrade();
  // ---- the second question: the kind of alert, the figures for the grade chosen, how they are computed, the forecast
  const KIND = d.test ? ['test', 'Test · a sample of the check screen'] : au ? ['au', d.kd === 'lead' ? 'Auction · lead' : d.kd === 'fcau' ? 'Auction · forecast' : 'Auction'] : d.kd === 'lead' ? ['lead', 'Lead'] : d.fc && d.fc.on ? ['fc', 'Forecast hit'] : ['hit', 'Hit'];
  $('s2h').innerHTML = 'The numbers <span class="kind ' + KIND[0] + '">' + esc(KIND[1]) + '</span>';
  $('s2sub').textContent = au ? 'Sells for about ' + money(d.nm[0]) + ' (NM). Bid your max in the last seconds: eBay never takes you over it.' : money(d.tot) + ' total · sells for about ' + money(d.nm[0]) + ' (NM)';
  const label = (name, a, ok) => au ? name + '<small>Max bid ' + money(a[4]) + '</small><small>Profit at least ' + money(a[2]) + '</small><small>ROI at least ' + a[3] + '%</small>' +
      '<small>' + (ok ? 'Bid still under your max' : 'Bid already over your max') + '</small>'
    : name + '<small>Max buy ' + money(a[1]) + '</small><small>Profit ' + money(a[2]) + '</small><small>ROI ' + a[3] + '%</small>' +
    '<small>' + (ok ? 'Above your ' + d.roi + '%: buy' : (d.ai > a[1] ? 'Over your max buy' : 'Under your ' + d.roi + '%') + ': not a buy') + '</small>';
  const okFor = a => !!a && (au || a[3] >= d.roi) && d.ai <= a[1];
  const go = code => { tell(code); done('Opening eBay…<br><a class="back" href="' + esc(d.u) + '">Tap here if it does not open</a>'); location.href = d.u; };
  const figBtn = (id, name, a, code) => { const ok = okFor(a); return '<button type="button" class="' + (ok ? 'yes' : 'over') + '" data-go="' + code + '">' + label(name, a, ok) + '</button>'; };   // red when over the max, still a link (Brett, 2026-10-25)
  function renderFig() {
    const box = $('fig');
    if (grade === 'NM' || grade === 'LP') box.innerHTML = '<div class="btns two">' + figBtn('g', grade === 'NM' ? 'Near Mint' : 'Lightly Played', grade === 'NM' ? d.nm : d.lp, grade === 'NM' ? 'nm' : 'lp') + '</div>';
    else if (grade) box.innerHTML = '<div class="nobuy"><b>Not a buy at this grade.</b> ' + COND[grade] + ' copies are outside the gate: the figures count near-mint and lightly played copies only, and your grade is saved on the site.<a href="' + esc(d.u) + '" target="_blank" rel="noopener">Open the listing anyway ↗</a></div>';
    else box.innerHTML = '<div class="dim" style="margin-top:8px">Pick your grade above to see its figures — or take either:</div><div class="btns two">' + figBtn('nm', 'Near Mint', d.nm, 'nm') + figBtn('lp', 'Lightly Played', d.lp, 'lp') + '</div>';
    box.querySelectorAll('button[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  }
  renderFig();
  // how the max buy is computed: the gate's inputs (Brett: "hits, to have variables such as confidence and margin")
  const pct1 = v => v == null ? '?' : (Math.round(v * 10) / 10) + '%';
  const sellAt = grade === 'LP' ? d.lp : d.nm;
  $('how').innerHTML = '<h3>How the ' + (au ? 'max bid' : 'max buy') + ' is computed</h3><ul>' +
    '<li>Sells for about <b>' + money(sellAt[0]) + '</b>' + (grade === 'LP' ? ' as lightly played (the LP discount ' + (d.lpd == null ? '?' : d.lpd + '%') + ')' : '') + (d.kd === 'lead' ? ' — a lead: priced from PriceCharting’s ' + money(d.pc) + ', capped by the cheapest other copy' : d.kd === 'fcau' ? ' — a forecast auction: the Forecast tab’s projected sale for the card; the max is the card’s standard price ' + money(sellAt[1]) + ' (the floor, else the anchor, else PriceCharting), not the gate’s max buy' : '') + '</li>' +
    (d.A != null ? '<li>eBay’s sold median (the anchor) <b>' + money(d.A) + '</b> on ' + (d.An || 0) + ' sales' + (d.af != null ? ' · fast-sale median ' + money(d.af) : '') + '</li>' : '<li>No eBay anchor yet for this card</li>') +
    '<li>Cheapest other credible copy (the floor) <b>' + (d.L == null ? 'none' : money(d.L)) + '</b> — the sale undercuts it</li>' +
    '<li>Liquidity: sells within <b>' + (d.win || 48) + ' h</b> with <b>' + (d.conf || 70) + '% confidence</b>' + (d.lam != null ? ' · ' + one(d.lam * 30) + ' sales / 30 d at this rate' : '') + (d.stt != null ? ' · 48-h sell-through ' + pct1(d.stt) : '') + '</li>' +
    '<li>Margin <b>' + d.roi + '%</b> on the money in · fees ' + (d.fee ? d.fee[0] + '% + ' + money(d.fee[1]) : 'eBay’s') + ' · buy tax ' + (d.tax || 0) + '%</li>' +
    '<li>All-in ' + money(d.ai) + ' against the max ' + (au ? 'bid ' + money(sellAt[4]) : 'buy ' + money(sellAt[1])) + ': <b class="' + (okFor(sellAt) ? 'ok' : 'bad') + '">' + (okFor(sellAt) ? 'a buy' : 'not a buy') + '</b> at this grade</li></ul>';
  // the Forecast section (Brett: "if it is a forecast hit, then the 1 3 and 6 month holds should be specified, as well as the other input variables")
  const fc = d.fc;
  if (fc) {
    const pc = v => v == null ? '—' : Math.round(v * 100) + '%', mv = v => v == null ? '—' : (v > 0 ? '+' : '') + Math.round(v * 100) + '%', rk = v => { if (v == null) return '—'; const n = Math.round(v * 100), s = n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'; return n + s; };
    $('fcb').classList.remove('hide');
    $('fcb').innerHTML = '<h3>Forecast · ' + (fc.on ? 'this alert passed your forecast filter: ' + fc.h + '-month hold, ' + fc.bar + '% or better' : 'your forecast filter is off (hold set to ' + fc.h + ' months)') + '</h3>' +
      '<table><tr><th>Hold</th><th class="num">Chance of a profit at ' + money(au ? sellAt[4] + (d.sh || 0) : d.tot) + '</th><th class="num">Card’s rank</th><th class="num">Expected move</th></tr>' +
      [1, 3, 6].map(h => '<tr' + (h === fc.h ? ' class="pick"' : '') + '><td>' + h + ' month' + (h > 1 ? 's' : '') + '</td><td class="num">' + pc(fc.q[h]) + '</td><td class="num">' + rk(fc.pct[h]) + ' pct</td><td class="num">' + mv(fc.pred[h]) + '</td></tr>').join('') + '</table>' +
      '<ul style="margin-top:6px"><li>Sale projected from <b>' + money(fc.sell) + '</b> (' + ({A: 'eBay’s sold median', thin: 'PriceCharting, the anchor being thin', pc: 'PriceCharting', ask: 'the cheapest competing copy', gap: 'PriceCharting, the lower of the two while the gap is unreviewed'}[fc.why] || fc.why || '?') + ')' + (fc.comp != null ? ' · cheapest competing copy ' + money(fc.comp) : '') + '</li>' +
      '<li>Standard buy price <b>' + money(fc.std) + '</b>' + (fc.m12 != null ? ' · 12-month mean ' + money(fc.m12) : '') + '</li>' +
      '<li>Model month ' + esc(fc.month || '?') + ' · market ' + esc(fc.reg || '?') + (fc.fees ? ' · fees ' + fc.fees[0] + '% + ' + money(fc.fees[1]) + (fc.fees[2] ? ' · buy tax ' + fc.fees[2] + '%' : '') : '') + '</li></ul>';
  }
  $('s2cond').innerHTML = 'Rank = where the card’s expected move sits among all scored cards; chance = P(net &gt; 0) from the model’s history for cards in that rank bucket, this market.';
  // ---- the first question's answers
  $('yes').addEventListener('click', () => { tell('yes'); show('s2'); });     // "same card" is an answer in itself now
  $('next').addEventListener('click', e => { e.preventDefault(); show('s2'); });  // just look at the next question: nothing is recorded
  // No -> why? the reason and a note become the listing's flag on the site (Brett, 2026-10-25: "a popup will appear and i
  // select the reason why, and provide a text response, that is saved and archived"); a set / name mismatch is the old
  // "not the same card" (the listing leaves every tab), the other reasons flag it (out of the supply and the hits, still
  // on Raw Data) - all of them sit in the site's Flags with the note
  const REASONS = [['set mismatch', 'another set: the listing leaves every tab, the matcher learns'], ['name mismatch', 'another card or number: the listing leaves every tab, the matcher learns'],
                   ['condition', 'the photos show a worse card than claimed: flagged, counts in nothing, stays on Raw Data'], ['fraud', 'a fake listing or a fake sale: flagged, the seller and its other listings go suspect'], ['unknown', 'something is off: flagged, counts in nothing, stays on Raw Data']];
  let reason = null;
  $('rbtns').innerHTML = REASONS.map(r => '<button type="button" class="rb" data-s="' + r[0] + '">' + r[0] + '</button>').join('');
  $('rbtns').addEventListener('click', e => { const b = e.target.closest('button.rb'); if (!b) return; reason = b.dataset.s; document.querySelectorAll('button.rb').forEach(x => x.classList.toggle('on', x === b)); $('rwhat').textContent = REASONS.find(r => r[0] === reason)[1]; $('rsend').disabled = false; });
  $('no').addEventListener('click', () => { $('nopanel').classList.remove('hide'); $('q1btns').classList.add('hide'); $('next').classList.add('hide'); setTimeout(() => $('nopanel').scrollIntoView({block: 'start', behavior: 'smooth'}), 50); });
  $('rcancel').addEventListener('click', e => { e.preventDefault(); $('nopanel').classList.add('hide'); $('q1btns').classList.remove('hide'); $('next').classList.remove('hide'); });
  $('rsend').addEventListener('click', () => {
    if (!reason) return;
    tell({d: 'no', st: reason, note: $('rnote').value.trim().slice(0, 1000)});
    const mm2 = /mismatch/.test(reason);
    done((mm2 ? 'Rejected: not the same card.' : 'Flagged: <b>' + esc(reason) + '</b>.') + ' Nothing was bought.<br><span class="dim">' +
      (mm2 ? 'The listing leaves every tab of the site and sits in the Mismatches list (Raw Data tab), with a Restore button if this was a mistake. The matcher learns from it.'
           : 'The listing stays on the Raw Data tab but counts in nothing: no supply, no anchor, no hit.' + (reason === 'fraud' ? ' The seller and its other listings are suspect from the collector’s next pass.' : '')) +
      ' Your reason and note are in the site’s Flags (click the red flag there to take it off).</span><br><span class="dim">You can close this page.</span>');
  });
  $('back').addEventListener('click', e => { e.preventDefault(); show('s1'); });
}
</script></body></html>
